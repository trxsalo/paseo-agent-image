name: Build and publish Paseo CLI image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate permission entrypoint syntax
        run: |
          sh -n docker/paseo-agent-config-permissions.sh
          sh -n docker/paseo-muse-launcher.sh

      - name: Validate provider smoke-test syntax
        run: sh -n tests/smoke-provider-binaries.sh

      - name: Test persistent CLI permission repair
        run: sudo python3 tests/test_permissions_entrypoint.py

      - name: Test Muse launcher staging
        run: python3 tests/test_muse_launcher_wrapper.py

      - name: Test ACP installation and config handling
        run: python3 -m unittest discover -s tests -p 'test_acp_installer.py'

      - name: Test init security boundaries
        run: sudo python3 -m unittest discover -s tests -p 'test_security_permissions.py'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
